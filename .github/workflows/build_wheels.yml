name: Wheels

on:
  push:
    branches:
        - '**'
    paths-ignore:
        - docs/**
        - ChangeLog*
    tags:
        - 'v[0-9]+.[0-9]+.[0-9]+'
        - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  pull_request:
    branches:
        - '**'
    paths-ignore:
        - docs/**
        - ChangeLog*

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build_sdist:

    name: SDist
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: Build sdist
        run: |
            python -m pip install build
            python -m build --sdist --outdir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: pymssql-sdist-${{ github.sha }}
          path: wheelhouse

  build-wheels-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install cibuildwheel==4.2.0
      - id: set-matrix
        run: |
          MATRIX_INCLUDE=$(
            {
              cibuildwheel --print-build-identifiers --platform linux --archs x86_64 | grep cp |  jq -nRc '{"only": inputs, "os": "ubuntu-latest"}'
            } | jq -sc
          )
          echo "include=$MATRIX_INCLUDE" >> $GITHUB_OUTPUT

  build_wheels:

    needs: build-wheels-matrix
    name: ${{ matrix.only }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-wheels-matrix.outputs.include) }}

    services:
      SQLServer:
        image: mcr.microsoft.com/mssql/server:2017-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: sqlServerPassw0rd
        ports:
          - 1433:1433

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          only: ${{ matrix.only }}
        env:
          #CIBW_BUILD_VERBOSITY: 1
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_I686_IMAGE: manylinux_2_28

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.only }}
          path: wheelhouse

  build_wheels_2:

    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14, macos-15-intel]
        arch: [auto]

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse

  build_wheels_windows:

    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: AMD64
          # Native build rather than cross-compiling from windows-latest.
          - os: windows-11-arm
            arch: ARM64

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: Install OpenSSL (AMD64)
        if: matrix.arch == 'AMD64'
        run: choco install openssl

      - name: Install OpenSSL (ARM64)
        # chocolatey's openssl only ships x64; slproweb publishes native
        # ARM64 builds separately (full edition - "Light" has no headers or
        # libs). Installed to the same path as AMD64 so setup.py and
        # FreeTDS's CMake find it without extra configuration.
        if: matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          $url = "https://slproweb.com/download/Win64ARMOpenSSL-3_5_7.exe"
          $expectedSha256 = "7E05F7E83F4C183664A7D2B7405524EDFCEEE790CB60F98BFE6307DAE36182CC"
          $exePath = "$env:RUNNER_TEMP\Win64ARMOpenSSL-3_5_7.exe"
          Invoke-WebRequest -Uri $url -OutFile $exePath
          $actualSha256 = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "SHA256 mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          $installDir = "C:\Program Files\OpenSSL"
          $proc = Start-Process -FilePath $exePath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "OpenSSL installer exited with code $($proc.ExitCode)"
            exit 1
          }
          if (-not (Test-Path "$installDir\include\openssl\ssl.h")) {
            Write-Error "OpenSSL headers not found at $installDir after install"
            exit 1
          }

      - name: Install gperf
        run: choco install gperf

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse

  merge_wheels:
    needs: [build_wheels, build_wheels_2, build_wheels_windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: wheels
          separate-directories: false
          delete-merged: false

  check_wheels:
    needs: [merge_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/

      - name: Check wheels
        run: |
            # upgrade packaging for PEP 639
            python -m pip install packaging>=24.2 --upgrade
            python -m pip install twine --upgrade
            python -m twine check --strict dist/*

  upload-wheels:
    needs: [check_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/

      - name: Publish wheels and sdist
        if: github.repository_owner == 'pymssql' && startsWith(github.ref, 'refs/tags/v')
        run: |
            # upgrade packaging for PEP 639
            python -m pip install packaging>=24.2 --upgrade
            python -m pip install twine --upgrade
            twine upload --skip-existing -u __token__ -p ${{secrets.PYMSSQL_PYPI_TOKEN}} dist/*

      #- name: Publish wheels and sdist on test.pypi.org
        #if: github.repository_owner == 'pymssql' && github.ref == 'refs/heads/master'
        #run: |
            ## upgrade packaging for PEP 639
            #python -m pip install packaging>=24.2 --upgrade
            #python -m pip install twine --upgrade
            #twine upload --skip-existing -u __token__ -p ${{secrets.PYMSSQL_TEST_PYPI_TOKEN}} --repository-url=https://test.pypi.org/legacy/ dist/*
